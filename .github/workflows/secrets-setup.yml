# ═══════════════════════════════════════════════════════════════════════════
# Kubernetes Secrets Setup Workflow
# Creates/updates the required secrets in Kubernetes
# Run this once to set up secrets, or when rotating keys
# ═══════════════════════════════════════════════════════════════════════════

name: Setup Kubernetes Secrets

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'development'
        type: choice
        options:
          - development
          - production
      action:
        description: 'Action to perform'
        required: true
        default: 'create'
        type: choice
        options:
          - create
          - delete
          - verify

jobs:
  secrets:
    name: Manage Secrets
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - name: Setup Kubernetes
        uses: 2060-io/devops/actions/setup-kube@main
        with:
          kubeconfig: ${{ secrets.KUBECONFIG }}

      - name: Verify Secrets Exist in GitHub
        run: |
          echo "🔐 Checking required GitHub secrets..."

          # These will fail if secrets don't exist
          if [ -z "${{ secrets.OPENAI_API_KEY }}" ]; then
            echo "⚠️  OPENAI_API_KEY not set in GitHub secrets"
          else
            echo "✅ OPENAI_API_KEY is configured"
          fi

          if [ -z "${{ secrets.ANTHROPIC_API_KEY }}" ]; then
            echo "⚠️  ANTHROPIC_API_KEY not set in GitHub secrets"
          else
            echo "✅ ANTHROPIC_API_KEY is configured"
          fi

          if [ -z "${{ secrets.SERPAPI_KEY }}" ]; then
            echo "⚠️  SERPAPI_KEY not set in GitHub secrets"
          else
            echo "✅ SERPAPI_KEY is configured"
          fi

          if [ -z "${{ secrets.OPENWEATHER_API_KEY }}" ]; then
            echo "⚠️  OPENWEATHER_API_KEY not set in GitHub secrets"
          else
            echo "✅ OPENWEATHER_API_KEY is configured"
          fi

      - name: Create Kubernetes Secret
        if: inputs.action == 'create'
        run: |
          NAMESPACE="demos"
          SECRET_NAME="concieragent-api-keys"
          
          echo "🔐 Creating Kubernetes secret: $SECRET_NAME"
          
          # Delete existing secret if it exists
          kubectl delete secret $SECRET_NAME -n $NAMESPACE --ignore-not-found
          
          # Create new secret
          kubectl create secret generic $SECRET_NAME \
            --namespace $NAMESPACE \
            --from-literal=OPENAI_API_KEY="${{ secrets.OPENAI_API_KEY }}" \
            --from-literal=ANTHROPIC_API_KEY="${{ secrets.ANTHROPIC_API_KEY }}" \
            --from-literal=SERPAPI_KEY="${{ secrets.SERPAPI_KEY }}" \
            --from-literal=OPENWEATHER_API_KEY="${{ secrets.OPENWEATHER_API_KEY }}"
          
          echo "✅ Secret created successfully"

      - name: Delete Kubernetes Secret
        if: inputs.action == 'delete'
        run: |
          NAMESPACE="demos"
          SECRET_NAME="concieragent-api-keys"
          
          echo "🗑️ Deleting Kubernetes secret: $SECRET_NAME"
          kubectl delete secret $SECRET_NAME -n $NAMESPACE --ignore-not-found
          echo "✅ Secret deleted"

      - name: Verify Kubernetes Secret
        if: inputs.action == 'verify'
        run: |
          NAMESPACE="demos"
          SECRET_NAME="concieragent-api-keys"
          
          echo "🔍 Verifying Kubernetes secret: $SECRET_NAME"
          
          if kubectl get secret $SECRET_NAME -n $NAMESPACE > /dev/null 2>&1; then
            echo "✅ Secret exists"
            echo ""
            echo "Secret keys:"
            kubectl get secret $SECRET_NAME -n $NAMESPACE -o jsonpath='{.data}' | jq 'keys'
          else
            echo "❌ Secret does not exist"
            exit 1
          fi
