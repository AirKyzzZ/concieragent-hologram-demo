# === Global chart version ===
# This version is used to deploy the chart and should be updated when the chart is updated.
# It is not used to deploy the application, but to deploy the chart itself.
chartSource: oci://registry-1.docker.io/io2060/webrtc-server-chart
chartVersion: v1.1.0

# === Chart's setup webrtc server ===
# Environment variables
env:
  MEDIASOUP_CLIENT_ICESERVER_PORT: "3480"
  MEDIASOUP_CLIENT_ICESERVER_USER: "hologram"
