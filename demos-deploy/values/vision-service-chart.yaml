# === Global chart version ===
# This version is used to deploy the chart and should be updated when the chart is updated.
# It is not used to deploy the application, but to deploy the chart itself.
chartSource: oci://registry-1.docker.io/io2060/vision-service-chart
chartVersion: v0.5.0

# === Chart's setup issuer ===
global:
  domain: example.io

app:
  name: vision-service

# Ingress configuration
ingress:
  name: vision-service-demos-ingress
  host: vision.{{ .Values.global.domain }}
  tlsSecret: vision.{{ .Values.global.domain }}-cert

statefulset:
  name: vision-service
  serviceName: vision-service
  replicas: 1
  containerName: vision-service
  pullPolicy: Always
  storage: 1Gi
  env:
    HOST: "0.0.0.0"
    NUMBER_OF_GESTURES_TO_REQUEST: "2"
    USE_MEDIASOUP_ICE_RELAY: "false"
    VISION_MATCHER_BASE_URL: "http://vision-matcher-service.demos:5123"
    ENABLE_DEBUG_ENDPOINTS: "false"

service:
  name: vision-service
  ports: 5000

vision-matcher-chart:
  enabled: true
  app:
    name: vision-matcher

  statefulset:
    name: vision-matcher
    serviceName: vision-matcher
    replicas: 1
    containerName: vision-matcher
    pullPolicy: Always
    storage: 1Gi

  service:
    name: vision-matcher-service
    ports:
      redis: 5123
