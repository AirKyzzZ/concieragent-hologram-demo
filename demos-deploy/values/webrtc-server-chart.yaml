# === Global chart version ===
# This version is used to deploy the chart and should be updated when the chart is updated.
# It is not used to deploy the application, but to deploy the chart itself.
chartSource: oci://registry-1.docker.io/io2060/webrtc-server-chart
chartVersion: v1.1.0

# === Chart's setup webrtc server ===
global:
  domain: example.2060.io

# Service configuration
service:
  name: webrtc-server-service
# Ingress configuration
ingress:
  name: webrtc-server-ingress
  host: webrtc.{{ .Values.global.domain }}
  tlsSecret: webrtc.{{ .Values.global.domain }}-cert
  loadBalancerMode: false

# Application name used in labels
app:
  name: webrtc-server

# StatefulSet configuration
statefulset:
  name: webrtc-server
  serviceName: "webrtc-server-service"
  replicas: 1
  containerName: webrtc-server-container
  pullPolicy: Always
  storage: 1Gi
  resources:
    requests:
      cpu: "200m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

# Environment variables
env:
  LOG_LEVEL: "3"
  DEBUG: "*mediasoup* *INFO* *WARN* *ERROR*"
  PROTOO_LISTEN_PORT: "4443"
  MEDIASOUP_CLIENT_PROTOOPORT: "443"
  MEDIASOUP_CLIENT_ENABLE_ICESERVER: "yes"
  MEDIASOUP_CLIENT_ICESERVER_HOST: "148.113.140.112"
  MEDIASOUP_CLIENT_ICESERVER_PROTO: "udp"
  MEDIASOUP_CLIENT_ICESERVER_PORT: "3478"
  MEDIASOUP_CLIENT_ICESERVER_USER: "hologram"
  MEDIASOUP_INGRESS_HOST: "webrtc.{{ .Values.global.domain }}"
  HTTPS_CERT_FULLCHAIN: "/config/certificates/tls.crt"
  HTTPS_CERT_PRIVKEY: "/config/certificates/tls.key"

  # Secret configuration
secret:
  name: "webrtc.{{ .Values.global.domain }}-cert"
