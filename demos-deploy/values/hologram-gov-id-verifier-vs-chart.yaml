# === Global chart version ===
# This version is used to deploy the chart and should be updated when the chart is updated.
# It is not used to deploy the application, but to deploy the chart itself.
chartSource: oci://registry-1.docker.io/io2060/hologram-generic-verifier-chart
chartVersion: v1.2.2

# === Chart's setup verifier ===
name: gov-id-verifier-app
containerPort: 2904
replicas: 1

ingress:
  host: "gov-id-verifier.{{ .Values.global.domain }}"
  tlsSecret: public.{{ .Values.name }}.{{ .Values.global.domain }}-cert

service:
  vsAgentAdminBaseUrl: http://gov-id-verifier-vsa:3000
  issuerDid: did:webvh:QmU1tBocQ6oZN3zaPFrx9hjB5BnzQr1Kb1GvKqY144Qjjp:dm.gov-id-issuer.{{ .Values.global.domain }}
  issuerLabel: Gov ID Issuer
  issuerImageUrl: https://s3.minio.{{ .Values.global.domain | trimPrefix "demos." }}/public/gov-id-issuer.png
  credentialDefinitionId: null
  issuerVsAgentAdminBaseUrl: http://gov-id-issuer-vsa:3000

vs-agent-chart:
  enabled: true
  name: gov-id-verifier-vsa
  didcommLabel: Gov ID Verifier
  eventsBaseUrl: http://gov-id-verifier-app:2904
  didcommInvitationImageUrl: https://s3.minio.{{ .Values.global.domain | trimPrefix "demos." }}/public/gov-id-verifier.png
  adminPort: 3000
  didcommPort: 3001
  ingress:
    host: "dm.gov-id-verifier.{{ .Values.global.domain }}" # Host for the vs agent service
    tlsSecret: public.{{ .Values.name }}.{{ .Values.global.domain }}-cert # TLS secret for the vs agent service
    public:
      enableCors: true

  extraEnv: 
    - name: USE_CORS
      value: "true"
    - name: SELF_ISSUED_VTC_ORG_TYPE
      value: "PRIVATE"
    - name: SELF_ISSUED_VTC_ORG_COUNTRYCODE
      value: "EE"
    - name: SELF_ISSUED_VTC_ORG_ADDRESS
      value: "Ahtri tn 13 10152 Tallinn"
    - name: SELF_ISSUED_VTC_SERVICE_TYPE
      value: "Demo Gov ID verifier"
    - name: SELF_ISSUED_VTC_SERVICE_DESCRIPTION
      value: "A demo service to verify Gov ID credentials"
    - name: SELF_ISSUED_VTC_SERVICE_MINIMUMAGEREQUIRED
      value: "18"
