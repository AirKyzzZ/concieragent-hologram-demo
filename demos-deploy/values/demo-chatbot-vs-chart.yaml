# === Global chart version ===
# This version is used to deploy the chart and should be updated when the chart is updated.
# It is not used to deploy the application, but to deploy the chart itself.
chartSource: oci://registry-1.docker.io/io2060/demo-chatbot-vs-chart
chartVersion: v1.5.1

# === Chart's setup issuer ===
global: 
  domain: demos.dev.2060.io

name: chatbot-app
replicas: 1
ingress:
  host: "chatbot.{{ .Values.global.domain }}"
  tlsSecret: public.{{ .Values.name }}.{{ .Values.global.domain }}-cert
env:
  vsAgentAdminUrl: http://chatbot-vsa:3000
  visionUrl: https://webrtc-pymediasoup-client.{{ .Values.global.domain }}
  webrtcUrl: https://webrtc.{{ .Values.global.domain }}
  port: 5000

vs-agent-chart:
  enabled: true
  name: chatbot-vsa
  didcommLabel: Chatbot Agent
  eventsBaseUrl: http://chatbot-app:5000
  didcommInvitationImageUrl: https://s3.minio.{{ .Values.global.domain | trimPrefix "demos." }}/public/chatbot.png
  ingress:
    host: "dm.chatbot.{{ .Values.global.domain }}" # Host for the vs agent service
    tlsSecret: public.{{ .Values.name }}.{{ .Values.global.domain }}-cert # TLS secret for the vs agent service
    private:
      whitelistSourceRange: "198.50.185.225/32"
      host: "admin.chatbot.{{ .Values.global.domain }}"

  extraEnv: 
    - name: AGENT_WALLET_ID
      value: "Chatbot Agent"
    - name: AGENT_WALLET_KEY
      value: "Chatbot Agent"
    - name: SELF_ISSUED_VTC_ORG_TYPE
      value: "PRIVATE"
    - name: SELF_ISSUED_VTC_ORG_COUNTRYCODE
      value: "EE"
    - name: SELF_ISSUED_VTC_ORG_ADDRESS
      value: "Ahtri tn 13 10152 Tallinn"
    - name: SELF_ISSUED_VTC_SERVICE_TYPE
      value: "Demo"
    - name: SELF_ISSUED_VTC_SERVICE_DESCRIPTION
      value: "A demo to test VS Agent and Hologram features"
    - name: SELF_ISSUED_VTC_SERVICE_MINIMUMAGEREQUIRED
      value: "1"
